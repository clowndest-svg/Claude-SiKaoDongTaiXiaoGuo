name: Windows build and verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, verify assets, and run read-only and animation checks
        shell: powershell
        run: .\scripts\test.ps1
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeXiaoKe-1.3.0-windows-x64
          path: |
            ClaudeXiaoKe.exe
            assets/
            README.md
            VERSION
            *.cmd
            安装自启.ps1
            停止小克娘.ps1
            卸载小克娘自启.ps1
          if-no-files-found: error
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            verification/motion-audit.json
            verification/*-motion-*.png
          if-no-files-found: warn
